name: Ironclad Signed Contract Processor
on:
  repository_dispatch:
    types: [ironclad_contract_signed] # This matches the event type we target

jobs:
  route_to_make:
    runs-on: ubuntu-latest
    steps:
      - name: Send context to Make.com
        env:
          MAKE_ENDPOINT: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          curl -X POST "$MAKE_ENDPOINT" \
            -H "Content-Type: application/json" \
            -d '${{ toJson(github.event.client_payload) }}'
