 name: Ironclad Auto-Driven Pipeline

on:
  repository_dispatch:
    types: [ironclad_contract_signed]

# Ensure only one runner processes an event at a time to prevent race conditions in Make.com
concurrency:
  group: ironclad-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  route_to_make:
    name: Validate and Forward Contract Context
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: System Sanity & Secret Check
        id: precheck
        env:
          MAKE_ENDPOINT: ${{ secrets.MAKE_WEBHOOK_URL || 'https://hook.us2.make.com/xf2pw3ckkthtymn498qi93t8g2d7vjca' }}
        run: |
          echo "=== Starting Pipeline Automation Validation ==="
          if [ -z "$MAKE_ENDPOINT" ]; then
            echo "::error::Critical Configuration Failure: MAKE_WEBHOOK_URL cannot be resolved."
            exit 1
          fi
          echo "✔ Destination Webhook secret validation successful."

      - name: Forward Payload to Make.com with Error Handling
        env:
          MAKE_ENDPOINT: ${{ secrets.MAKE_WEBHOOK_URL || 'https://hook.us2.make.com/xf2pw3ckkthtymn498qi93t8g2d7vjca' }}
          EVENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "=== Initiating Secure Handshake with Make.com ==="
          
          # Write payload directly to a temporary file to avoid shell expansion / formatting quote errors
          echo "$EVENT_PAYLOAD" > payload.json
          
          # Execute POST request with error handling parameters
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$MAKE_ENDPOINT" \
            -H "Content-Type: application/json" \
            -H "X-Source-Trigger: GitHub-Actions-Ironclad-Pipeline" \
            -d @payload.json \
            --retry 3 \
            --retry-delay 2 \
            --max-time 15 \
            --fail)

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          
          echo "=== Pipeline Handshake Completed ==="
          echo "Response Status Code from Make.com: $HTTP_STATUS"
          echo "Pipeline is locked, loaded, and operating fully automated."
          
          # Clean up system footprint
          rm -f payload.json
          
