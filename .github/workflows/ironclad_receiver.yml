name: Ironclad Auto-Driven Pipeline
on:
  repository_dispatch:
    types: [ironclad_contract_signed]

jobs:
  process_and_forward:
    name: Route Signature Context to Make.com
    runs-on: ubuntu-latest
    
    steps:
      - name: Validate and Forward Payload
        env:
          MAKE_ENDPOINT: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          # Verify the destination secret is safely configured before executing
          if [ -z "$MAKE_ENDPOINT" ]; then
            echo "::error::MAKE_WEBHOOK_URL is missing from GitHub Secrets. Aborting pipeline."
            exit 1
          fi

          echo "Automated trigger verified. Forwarding Ironclad payload to Make.com..."
          
          # Fire the webhook with the entire payload context
          curl -X POST "$MAKE_ENDPOINT" \
            -H "Content-Type: application/json" \
            -d '${{ toJson(github.event.client_payload) }}' \
            --fail --show-error
            
